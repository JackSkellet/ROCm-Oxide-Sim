[workspace]
members = [
    "crates/sim-core",
    "crates/sim-sensors",
    "crates/sim-render-rocm",
    "crates/sim-datasets",
    "crates/sim-physics",
    "apps/sensor_lab",
    "apps/dataset_generator",
    "apps/sim_viewer",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JackSkellet/rocm-oxide-sim"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-sensors = { path = "crates/sim-sensors" }
sim-render-rocm = { path = "crates/sim-render-rocm" }
sim-datasets = { path = "crates/sim-datasets" }
sim-physics = { path = "crates/sim-physics" }
rocm-oxide = { path = "../ROCm-Oxide" }

clap = { version = "4.5", features = ["derive"] }
pixels = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
winit = "0.28"
